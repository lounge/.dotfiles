version: "3"

endpoints:

  # SRK Endpoints

  - name: srk-rednet
    url: https://srk2-erkpn-rednet.eu.ngrok.io
    upstream:
      url: https://srk-erkpn-rednet.local.se:8001
    traffic_policy:
      on_http_request:
        - actions:
            - type: add-headers
              config:
                headers:
                  host: "srk-erkpn-rednet.local.se:8001"

  - name: srk-www
